name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Build Jar
        env:
          ROOT_DB_USER: ${{ secrets.ROOT_DB_USER }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
          MAIN_HOST: ${{ vars.MAIN_HOST }}
        run: |
          set -eu
          chmod +x mvnw

          echo "Packaging application..."          
          ./mvnw clean package

      - name: Build CloudFormation Stack
        run: |
          echo "Synthesizing CloudFormation template..."
          java -jar target/infra-1.0-SNAPSHOT.jar

      - name: Upload CloudFormation Stack
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: cdk.out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download CloudFormation Stack
        uses: actions/download-artifact@v8
        with:
          name: cdk-out
          path: cdk.out

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation Stack
        run: |
          echo "Deploying Cdcollaguazo..."
          aws cloudformation deploy \
            --stack-name Cdcollaguazo \
            --template-file cdk.out/Cdcollaguazo.template.json
