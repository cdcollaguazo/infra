name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Compile
        run: |
          set -e
          chmod +x mvnw

          echo "Starting compilation..."          
          mvnw clean compile
